[cortex_debug_docs]
kind      = "markdown"
min_pages = 2
# The VS Code debug adapter that nvim-dap-cortex-debug drives. debug_attributes.md
# is the launch.json schema -- svdFile and runToEntryPoint are both referenced in
# /etc/nixos/CLAUDE.md and had 0 hits across every dump before this entry.
# CHANGELOG.md (861 lines) is deliberately excluded: release noise, not reference.
sentinels = ["svdFile", "runToEntryPoint", "openocd"]
urls = [
  "https://raw.githubusercontent.com/Marus/cortex-debug/master/debug_attributes.md",
  "https://raw.githubusercontent.com/Marus/cortex-debug/master/README.md",
]

[stm32f4_hal]
kind      = "doxygen"
# SCOPED TO THE DRIVER DIRECTORY ON PURPOSE. The firmware package around it is
# 2.7 GB (Middlewares/TouchGFX, STemWin, Projects, CMSIS); including any of that
# would produce a dump larger than arch_wiki.txt. F4 matches the target board,
# embedded/BlackPill -> board = blackpill_f411ce.
root      = "~/STM32Cube/Repository/STM32Cube_FW_F4_V1.28.3/Drivers/STM32F4xx_HAL_Driver/Src"
glob      = "*.c"
title     = "STM32F4 HAL API Reference"
min_pages = 50
sentinels = ["HAL_GPIO_WritePin", "GPIO_PIN_RESET", "HAL_StatusTypeDef"]

[openocd_manual]
kind        = "texinfo"
# From the openocd this system runs, not the project website: the .info files
# ship inside the derivation, so the manual always matches the installed binary.
expr        = "let f = builtins.getFlake \"/etc/nixos\"; in f.inputs.nixpkgs.legacyPackages.x86_64-linux.openocd"
info_glob   = "share/info/openocd.info*"
title       = "OpenOCD User's Guide"
min_pages   = 20
sentinels   = ["flash bank", "STM32", "swd"]

[arch_wiki]
kind        = "mediawiki"
api         = "https://wiki.archlinux.org/api.php"
namespace   = 0
user_agent  = "arch-wiki-scraper/1.0 (nixos-config)"
min_pages   = 4000
sentinels   = ["Pacman", "Systemd"]

# Local PDF, already on disk with the F4 firmware -- no download involved.
# Also the worked example of the `pdf` kind: one dump page per PDF page, so an
# index entry reads "... — page 12" and a citation resolves directly.
[stm32cube_getting_started]
kind      = "pdf"
files     = ["~/STM32Cube/Repository/STM32Cube_FW_F4_V1.28.3/Documentation/STM32CubeF4GettingStarted.pdf"]
doc_title = "UM1730 STM32CubeF4 Getting Started"
title     = "STM32CubeF4 Getting Started (UM1730)"
min_pages = 20
sentinels = ["STM32Cube", "HAL"]

# FreeCAD, from the installed 1.0.0 (apt). freecadcmd is FreeCAD's headless
# interpreter; its docstrings and registered types match this machine, unlike
# the wiki's API pages, which mark themselves outdated (2018-2019).
[freecad_api]
kind        = "pydoc"
interpreter = "freecadcmd"
title       = "FreeCAD Python API (installed)"
modules     = ["FreeCAD", "Part", "Sketcher", "PartDesign", "Mesh", "MeshPart",
               "Import", "Spreadsheet"]
# Document objects carry their properties only on an instance; one page per
# type with its property table. Preload registers each module's types.
freecad_preload       = ["Part", "Sketcher", "PartDesign", "Spreadsheet", "Mesh"]
freecad_type_prefixes = ["App::", "Part::", "PartDesign::", "Sketcher::", "Spreadsheet::"]
min_pages   = 150
# makeBox is a Part module function; Constraint is Sketcher's; PartDesign::Pad
# exists only through type introspection -- each fails a different stage.
sentinels   = ["makeBox", "Sketcher.Constraint", "type PartDesign::Pad", "fillet"]

# Worked examples and tutorials. Category-scoped: the full wiki is 382,000
# pages, most of them translations. The API category is kept for its examples,
# but freecad_api is authoritative for signatures.
[freecad_wiki]
kind        = "mediawiki"
api         = "https://wiki.freecad.org/api.php"
namespace   = 0
categories  = ["Category:API", "Category:Python_Code"]
titles      = ["Sketcher scripting", "Scripting", "Power users hub",
               "PartDesign Body", "PartDesign Pad", "PartDesign Pocket"]
min_pages   = 70
# addGeometry lives inside a {{Code|code=}} block: it vanishes first if
# code-template expansion regresses.
sentinels   = ["addGeometry", "Part.makeBox", "makeCylinder"]


# C, C++, and Python references. Archive releases are explicit; local man-pages
# follow the installed Debian manpages/manpages-dev package versions.
[cppreference_c]
kind = "archive"
title = "cppreference C — offline release 2025-02-09"
urls = ["https://github.com/PeterFeicht/cppreference-doc/releases/download/v20250209/html-book-20250209.tar.xz"]
prefixes = ["reference/en/c/", "reference/en/c.html"]
strip_root = "reference/en/"
source_base = "https://en.cppreference.com/w/"
content_id = "mw-content-text"
source_remove_suffix = ".html"
min_pages = 500
sentinels = ["restrict", "realloc", "memory_order", "#include <stdio.h>"]

